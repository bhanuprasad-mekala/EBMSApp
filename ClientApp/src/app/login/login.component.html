<div class="d-flex justify-content-center align-items-center">
  <div class="card shadow-lg" style="width: 40rem;">
    <div class="card-header text-center bg-primary text-white">
      <h2>Login</h2>
    </div>
    <div class="card-body">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email-id">Email ID</label>
          <input type="text" id="email-id" class="form-control" formControlName="emailId" placeholder="Enter Email ID">
        </div>
        <div class="form-group mb-3">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" formControlName="password" placeholder="Enter password">
        </div>
        <div class="form-group form-check mb-3">
          <input type="checkbox" id="remember-me" class="form-check-input" formControlName="rememberMe">
          <label for="remember-me" class="form-check-label">Remember Me</label>
        </div>
        <div class="d-flex justify-content-center">
          <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid">Login</button>
        </div>
      </form>
    </div>
  </div>
</div>
